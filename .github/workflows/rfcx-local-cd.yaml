# Reusable workflow: build + deploy to rfcx-local cluster
#
# Called from each rfcx-org repo's `cd.yaml` alongside the existing AWS
# deploy job. Runs on our self-hosted runner inside the rfcx-local
# cluster (label: `rfcx-local-deployment-runner`).
#
# Two stages:
#   1. build (matrix over `targets`)    — buildx each Dockerfile stage and push to local registry
#   2. deploy (matrix over `deployments`) — for each apps-prod deployment, kubectl set-image to the
#                                            newly-built tag of its source image
#
# `deployments` is a JSON array of `{"name": "<apps-prod deployment>", "image": "<target stage>"}` so a
# single image stage can be deployed to multiple apps-prod deployments (e.g., core-api → core-api + media-api).
#
# Usage in caller's cd.yaml:
#
#   deploy-rfcx-local:
#     needs: [prepare, configure]
#     if: ${{ needs.configure.outputs.namespace == 'production' }}
#     uses: rfcx/cicd/.github/workflows/rfcx-local-cd.yaml@master
#     with:
#       dockerfile: build/Dockerfile
#       targets: '["core-api","core-tasks","noncore-api","noncore-mqtt"]'
#       deployments: |
#         [
#           {"name": "core-api",     "image": "core-api"},
#           {"name": "core-tasks",   "image": "core-tasks"},
#           {"name": "noncore-api",  "image": "noncore-api"},
#           {"name": "noncore-mqtt", "image": "noncore-mqtt"},
#           {"name": "media-api",    "image": "core-api"}
#         ]
#       repo: rfcx-api

name: 'rfcx-local CD (reusable)'

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Path to Dockerfile within the source repo'
        required: false
        type: string
        default: 'build/Dockerfile'
      targets:
        description: 'JSON array of Dockerfile target stages to build'
        required: true
        type: string
      deployments:
        description: |
          JSON array of {name, image} for apps-prod workloads to roll out.
          Optional per-entry `kind` selects the workload type: "deployment"
          (default) or "cronjob". CronJobs have no rollout to wait on -- the
          new image is picked up by the next scheduled run -- so they are
          image-set only. Without this, CronJob pins have to be hand-rolled
          with `kubectl set image` outside CI/CD.
        required: false
        type: string
        default: '[]'
      repo:
        description: 'Repo name (for log messages)'
        required: true
        type: string
      rollout-timeout:
        description: |
          Per-deployment rollout-status timeout, in seconds. Each
          deployment in `deployments` is waited on for up to this
          long via `kubectl rollout status`. Defaults to 600s (10min)
          which covers most apps-prod Deployments with rolling-update
          maxSurge=1 (~3 min per replica) on slow-start images.
          Bump for unusually heavy services; lower for synthetic tests.
        required: false
        type: number
        default: 600
      build-cache:
        description: |
          Enable BuildKit layer caching via the in-cluster registry
          (`--cache-to`/`--cache-from type=registry`, a `:buildcache` tag on
          each target's own image repo, e.g.
          `registry.data.svc.cluster.local:5000/biodiversity-api:buildcache`).

          DEFAULT FALSE, DELIBERATELY. This workflow is shared by arbimon,
          arbimon-legacy, rfcx-api, device-api and ingest-service, and every
          caller pins `@master` -- so a default-on change would alter all five
          repos' CD on their next merge simultaneously. Opting in per repo keeps
          the blast radius to one caller at a time.

          WHY IT HELPS (measured 2026-09-04 on rfcx/arbimon): the build matrix
          runs on a SINGLE self-hosted runner (`rfcx-local-deployment-runner`,
          replicas: 1) so targets build SERIALLY, and buildx's docker-container
          driver is torn down per job, so nothing is cached between runs. A
          3-target arbimon CD spent ~12.2 min of its ~14.5 min in three builds
          of ~205-275s each, all recomputing the SAME shared `build` stage.

          PROVEN against this registry (registry 2.8.3 + MinIO backend) before
          shipping: cold build exported a cache manifest, and a FRESH
          docker-container builder imported it (21s -> 2s, 2 CACHED layers) --
          i.e. the cross-job case CI actually hits.

          FAILS SAFE: cache-from on a missing/GC'd tag is a cache MISS, not an
          error, so the build still succeeds (just slow). `ignore-error=true` on
          cache-to means an export failure cannot fail a deploy.
        required: false
        type: boolean
        default: false
      build-args:
        description: |
          Extra `--build-arg` values for `docker buildx build`, ONE `KEY=VALUE`
          PER LINE (blank lines ignored). Applied to EVERY target in the matrix.

          DEFAULT EMPTY, DELIBERATELY -- same reasoning as `build-cache`: every
          caller pins `@master`, so only an opt-in keeps the change to one repo
          at a time. Empty => no `--build-arg` flag is added, i.e. the build
          command is byte-for-byte what it was before this input existed.

          WHY (2026-09-27, rfcx-local OPEN-ITEMS 412): rfcx/arbimon's Dockerfile
          already declares `ARG release_commit` / `ARG release_date` and bakes
          them into the website as VITE_RELEASE_COMMIT / VITE_RELEASE_DATE, but
          this workflow passed no build args, so both were EMPTY in every
          production image -- a post-ship check could not tell which build a
          user's tab was running.

          Each line is passed as ONE argv element (never through the shell), so
          a value cannot inject further flags. A line without `=` fails the
          build loudly rather than being silently dropped.

          CACHE NOTE: a build arg only invalidates the layers of the stage that
          declares it (and below). Pass a per-commit value only to a stage that
          rebuilds on every commit anyway.
        required: false
        type: string
        default: ''

jobs:
  build:
    name: 'rfcx-local build: ${{ matrix.target }}'
    runs-on: rfcx-local-deployment-runner
    strategy:
      matrix:
        target: ${{ fromJson(inputs.targets) }}
      fail-fast: false
    env:
      # Push to the in-cluster HA registry by its STABLE cluster DNS Service name,
      # NOT the 192.168.5.1:30500 host-gateway alias (buildx's docker-container
      # driver does not honor the k3s containerd registry mirror, so the build job
      # must target a real registry address itself).
      #
      # The CD runner (ns cicd, on tier=build) runs in the cluster, and its dind
      # build environment resolves cluster DNS + reaches the registry ClusterIP
      # (verified 2026-06-29 with a real buildx push using the SAME default
      # docker-container driver this workflow uses). registry.data.svc =
      # the `registry` Service (ClusterIP, port 5000) -> kube-proxy load-balances
      # across the 3 registry-ha replicas and AUTOMATICALLY excludes any down
      # replica, so there is NO single-node SPOF. sessionAffinity:ClientIP on that
      # Service (data-stores/registry/registry-service.yaml) keeps all chunks of
      # one push on one replica (else docker/distribution's stateful chunked blob
      # upload across replicas -> `blob upload invalid`). All replicas share one
      # distributed-MinIO backend, so the push is immediately visible to the
      # kubelet pull (which resolves the unchanged image ref 192.168.5.1:30500 to
      # the same .2.x registry nodes via registries.yaml; verified crictl-pullable).
      #
      # History: was 192.168.64.21:30500 (RETIRED platform-a node -> i/o timeout),
      # then briefly the single node 192.168.2.200:30500 (worked but a 1-node SPOF);
      # moved to the Service DNS for HA on 2026-06-29.
      REGISTRY: registry.data.svc.cluster.local:5000
    outputs:
      unique-tag: ${{ steps.meta.outputs.unique-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 'Setup: docker buildx'
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [registry."registry.data.svc.cluster.local:5000"]
              http = true
              insecure = true

      - name: 'Meta: compute tag'
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          UNIQUE_TAG="rfcx-local-prod-${SHORT_SHA}"
          echo "unique-tag=${UNIQUE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.target }} as ${UNIQUE_TAG}..."

      - name: 'Build + push'
        env:
          BUILD_CACHE: ${{ inputs.build-cache }}
          BUILD_ARGS: ${{ inputs.build-args }}
          ALL_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail

          # Cache args are built as an ARRAY and are EMPTY unless build-cache is
          # true, so the default path is byte-for-byte the pre-2026-09-04 command.
          #
          # EXPORT to a per-TARGET ref, IMPORT from EVERY target's ref.
          #
          # Export per target because `mode=max` records every stage in the
          # manifest and one shared ref would have targets overwrite each other
          # last-writer-wins. But import from ALL of them: targets in one run
          # share lower stages (apt/yarn/pnpm deps, a common `build`), and the
          # matrix runs SERIALLY on one runner, so build N can hit the stages
          # build N-1 just exported -- WITHIN the same run. Importing only the
          # own ref makes every target's FIRST run a full cold build even when
          # a sibling finished the shared work seconds earlier. Measured on
          # rfcx-api (4 targets, one shared `build` stage): with own-ref-only
          # import, core-tasks built 4th at 140s with 1 CACHED step and
          # `buildcache: not found`, while core-api had exported the identical
          # shared stage 3 builds before. buildx treats each --cache-from as an
          # independent source; a missing sibling ref is a harmless miss.
          #
          # ignore-error=true: a cache EXPORT failure (registry hiccup, GC race)
          # must never fail a deploy that has already built successfully.
          if [ "${BUILD_CACHE}" = "true" ]; then
            CACHE_REF="${REGISTRY}/${{ matrix.target }}:buildcache"
            echo "Build cache ENABLED -> export ${CACHE_REF}"
            set -- --cache-to "type=registry,ref=${CACHE_REF},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
            # every target in this run's matrix (own ref included)
            for t in $(printf '%s' "${ALL_TARGETS}" | tr -d '[]"' | tr ',' ' '); do
              echo "  import ${REGISTRY}/${t}:buildcache"
              set -- "$@" --cache-from "type=registry,ref=${REGISTRY}/${t}:buildcache"
            done
          else
            echo "Build cache disabled (default)"
            set --
          fi

          # Opt-in build args (input `build-args`). An EMPTY input yields an
          # EMPTY array, which expands to NOTHING below -- the default command
          # is unchanged. Each line becomes exactly one `--build-arg` argv
          # element (no word-splitting, no globbing, no eval).
          EXTRA_BUILD_ARGS=()
          while IFS= read -r line || [ -n "${line}" ]; do
            line="${line%$'\r'}"
            [ -z "${line//[[:space:]]/}" ] && continue
            case "${line}" in
              *=*) ;;
              *) echo "::error::build-args line is not KEY=VALUE: '${line}'"; exit 1 ;;
            esac
            echo "  build-arg ${line%%=*}"
            EXTRA_BUILD_ARGS+=(--build-arg "${line}")
          done <<< "${BUILD_ARGS}"

          docker buildx build \
            --platform linux/arm64 \
            --file "${{ inputs.dockerfile }}" \
            --target "${{ matrix.target }}" \
            --tag "${REGISTRY}/${{ matrix.target }}:${{ steps.meta.outputs.unique-tag }}" \
            --tag "${REGISTRY}/${{ matrix.target }}:native-arm64-latest" \
            --tag "${REGISTRY}/${{ matrix.target }}:rfcx-local-prod-latest" \
            "$@" \
            "${EXTRA_BUILD_ARGS[@]}" \
            --output type=registry,registry.insecure=true \
            .

  deploy:
    name: 'rfcx-local deploy: ${{ matrix.entry.name }}'
    needs: [build]
    if: ${{ inputs.deployments != '[]' && inputs.deployments != '' }}
    runs-on: rfcx-local-deployment-runner
    strategy:
      matrix:
        entry: ${{ fromJson(inputs.deployments) }}
      fail-fast: false
    env:
      # set image references the 192.168.5.1:30500 host-gateway alias (consistent with
      # the apps-prod/*.yaml repo manifests); the kubelet's k3s containerd mirror
      # (bootstrap/k3s-agent-configs/registries.yaml) resolves 192.168.5.1:30500 ->
      # the HA registry nodes 192.168.2.199/200/201:30500, the same shared backend
      # the build job pushed to via registry.data.svc above, so the pull succeeds.
      # Image REFERENCES intentionally stay on the .5.1 alias (it is what the
      # NODES' containerd mirror knows; cluster DNS like registry.data.svc is NOT
      # resolvable from a node's containerd, only from inside the pod network where
      # the build job runs). Only the build-PUSH target uses the Service DNS.
      REGISTRY: 192.168.5.1:30500
      NAMESPACE: apps-prod
      ROLLOUT_TIMEOUT: ${{ inputs.rollout-timeout }}
    steps:
      - name: 'kubectl set image'
        run: |
          set -euo pipefail
          DEPLOY_NAME="${{ matrix.entry.name }}"
          IMAGE_NAME="${{ matrix.entry.image }}"
          KIND="${{ matrix.entry.kind || 'deployment' }}"
          UNIQUE_TAG="${{ needs.build.outputs.unique-tag }}"

          case "${KIND}" in
            deployment)
              # containers[0] is the convention across apps-prod; a multi-container
              # workload would need an explicit container name in the entry.
              CONTAINER_NAME=$(kubectl -n "${NAMESPACE}" get deploy "${DEPLOY_NAME}" \
                -o jsonpath='{.spec.template.spec.containers[0].name}')
              echo "Setting image for deployment ${DEPLOY_NAME}/${CONTAINER_NAME} -> ${REGISTRY}/${IMAGE_NAME}:${UNIQUE_TAG}"
              kubectl -n "${NAMESPACE}" set image "deployment/${DEPLOY_NAME}" \
                "${CONTAINER_NAME}=${REGISTRY}/${IMAGE_NAME}:${UNIQUE_TAG}"
              echo "Waiting for rollout (timeout ${ROLLOUT_TIMEOUT}s)..."
              kubectl -n "${NAMESPACE}" rollout status "deployment/${DEPLOY_NAME}" --timeout="${ROLLOUT_TIMEOUT}s"
              echo "::notice title=rfcx-local::${{ inputs.repo }}/${DEPLOY_NAME} rolled out to ${UNIQUE_TAG}"
              ;;
            cronjob)
              CONTAINER_NAME=$(kubectl -n "${NAMESPACE}" get cronjob "${DEPLOY_NAME}" \
                -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].name}')
              echo "Setting image for cronjob ${DEPLOY_NAME}/${CONTAINER_NAME} -> ${REGISTRY}/${IMAGE_NAME}:${UNIQUE_TAG}"
              kubectl -n "${NAMESPACE}" set image "cronjob/${DEPLOY_NAME}" \
                "${CONTAINER_NAME}=${REGISTRY}/${IMAGE_NAME}:${UNIQUE_TAG}"
              # A CronJob has no rollout to wait on; verify the pin took instead,
              # so a silent no-op cannot pass as success.
              APPLIED=$(kubectl -n "${NAMESPACE}" get cronjob "${DEPLOY_NAME}" \
                -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}')
              echo "CronJob image now: ${APPLIED}"
              if [ "${APPLIED}" != "${REGISTRY}/${IMAGE_NAME}:${UNIQUE_TAG}" ]; then
                echo "::error title=rfcx-local::${DEPLOY_NAME} image did not take (${APPLIED})"
                exit 1
              fi
              echo "::notice title=rfcx-local::${{ inputs.repo }}/${DEPLOY_NAME} (cronjob) pinned to ${UNIQUE_TAG}; applies on next scheduled run"
              ;;
            *)
              echo "::error title=rfcx-local::unknown kind '${KIND}' for ${DEPLOY_NAME} (expected deployment|cronjob)"
              exit 1
              ;;
          esac