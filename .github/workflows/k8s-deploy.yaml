on:
  workflow_call:
    inputs:
      runs-on:
        description: Platform to execute on
        type: string
        default: deployment-runner
        required: false
      tag:
        description: Image tag to deploy
        type: string
        required: true
      namespace:
        description: Kubernetes namespace
        type: string
        required: true
    secrets:
      kube-config:
        description: KUBE_CONFIG file
        required: true
# ─────────────────────────────────────────────────────────────────────────────
# 🛑 RETIRED 2026-08-31 — this workflow deployed to the AWS estate and is now
# DISARMED. It fails fast instead of deploying.
#
# WHY. Production moved to the self-hosted rfcx-local cluster. This reusable
# still (a) defaulted `runs-on` to the legacy AWS `deployment-runner`, which was
# still ONLINE and reachable, and (b) ran `kubectl apply` against the AWS
# cluster using `KUBE_CONFIG_SUPER`. 13 workflow files across 12 repos could
# still reach AWS through it — all on stale branches, none of them the branch
# that actually deploys today. A push to any of those branches would have
# deployed to AWS silently.
#
# WHAT REPLACED IT. rfcx-local CD is INDEPENDENT of this file and is unaffected:
# `rfcx-local-cd.yaml` and `rfcx-local-worker-cd.yaml` never call this workflow
# and run on `rfcx-local-deployment-runner`. Verified before disarming.
#
# ⚠️ AWS RESOURCES WERE DELIBERATELY NOT TOUCHED. The AWS-side cluster, its
# load balancers and instances are left exactly as they are; this change only
# severs the GitHub CI/CD -> AWS path. Retiring the AWS estate itself is a
# separate, operator-owned decision (see rfcx-local OPEN-ITEMS §209 bucket C:
# `infra-aws` Deploy/Destroy are deliberately KEPT and are NOT affected here).
#
# TO RE-ENABLE: restore the `deploy` job from git history — this file's inputs
# and secrets interface is unchanged, so callers keep working.
# Runs on ubuntu-latest so it does not depend on the legacy runner existing.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'RETIRED: this AWS deploy path is disabled'
        run: |
          echo "::error title=AWS deploy path retired::rfcx/cicd k8s-deploy.yaml no longer deploys to AWS."
          echo ""
          echo "This reusable workflow deployed to the AWS cluster and was disarmed on 2026-08-31."
          echo "Production runs on the self-hosted rfcx-local cluster."
          echo ""
          echo "  caller     : ${{ github.repository }}@${{ github.ref_name }}"
          echo "  namespace  : ${{ inputs.namespace }}"
          echo "  tag        : ${{ inputs.tag }}"
          echo ""
          echo "If this workload should still deploy, port it to the rfcx-local lane:"
          echo "  uses: rfcx/cicd/.github/workflows/rfcx-local-cd.yaml@master"
          echo "  (or rfcx-local-worker-cd.yaml for CronJob/worker images)"
          echo ""
          echo "To restore the old AWS behaviour, revert this file from git history."
          exit 1
