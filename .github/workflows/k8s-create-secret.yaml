on:
  workflow_call:
    inputs:
      runs-on:
        description: Platform to execute on
        type: string
        default: deployment-runner
        required: false
      namespace:
        description: Kubernetes namespace
        type: string
        required: true
      name:
        description: Kubernetes Secret name
        type: string
        required: true
      includes:
        description: List (comma-separated) of GitHub secret names to include in the Kubernetes Secret
        type: string
        required: true
# ─────────────────────────────────────────────────────────────────────────────
# 🛑 RETIRED 2026-08-31 — this workflow pushed Kubernetes Secrets into the AWS
# estate and is now DISARMED. It fails fast instead of applying anything.
#
# WHY. It defaulted `runs-on` to the legacy AWS `deployment-runner` (still
# online and reachable) and applied a Secret built from GitHub secrets into the
# AWS cluster via `KUBE_CONFIG_SUPER`. Production runs on the self-hosted
# rfcx-local cluster, whose CD (`rfcx-local-cd.yaml` / `rfcx-local-worker-cd.yaml`)
# never calls this workflow — verified before disarming, so rfcx-local CD is
# unaffected.
#
# This one is deliberately disarmed rather than left dormant because it
# MATERIALISES GITHUB SECRETS into a cluster we no longer deploy to.
#
# ⚠️ AWS RESOURCES WERE DELIBERATELY NOT TOUCHED — this severs only the GitHub
# CI/CD -> AWS path. Retiring the AWS estate is a separate operator decision
# (rfcx-local OPEN-ITEMS §209 bucket C keeps `infra-aws` Deploy/Destroy intact).
#
# TO RE-ENABLE: restore the job from git history; the inputs/secrets interface
# is unchanged. Runs on ubuntu-latest so it does not need the legacy runner.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  'create-secret':
    runs-on: ubuntu-latest
    steps:
      - name: 'RETIRED: this AWS secret-apply path is disabled'
        run: |
          echo "::error title=AWS secret path retired::rfcx/cicd k8s-create-secret.yaml no longer applies secrets to AWS."
          echo ""
          echo "Disarmed 2026-08-31. Production runs on the self-hosted rfcx-local cluster."
          echo ""
          echo "  caller    : ${{ github.repository }}@${{ github.ref_name }}"
          echo "  namespace : ${{ inputs.namespace }}"
          echo "  secret    : ${{ inputs.name }}"
          echo ""
          echo "No secret was created and nothing was sent to any cluster."
          echo "To restore the old AWS behaviour, revert this file from git history."
          exit 1
